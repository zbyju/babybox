# Overuje to, co panelove pocitace delaji pri startu. Nejdulezitejsi je frozen
# install: startup.sh po nem konci chybou, takze rozjety lockfile na main by
# znamenal, ze panel nenabehne.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Prvni boot po pullu. Checkout je tag legacy-runtime, pak git pull na hlavu
  # PR a pnpm run build. Exit 0, prazdny stderr, cisty strom.
  # Dalsi krok overi bun 1.4.2, build po hotovem checkoutu, a nucene selhani.
  legacy-image:
    name: legacy-image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout legacy-runtime
        uses: actions/checkout@v4
        with:
          ref: legacy-runtime
          fetch-depth: 0

      - name: Pull the pull request head
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git checkout -B legacy-image
          if [ -n "${PR_NUMBER}" ]; then
            git fetch origin "pull/${PR_NUMBER}/head"
          else
            git fetch origin main
          fi
          merge_out="$(git merge --ff-only FETCH_HEAD)"
          printf '%s\n' "${merge_out}"
          if [ -z "${merge_out}" ]; then
            echo "git pull produced empty stdout" >&2
            exit 1
          fi
          if printf '%s' "${merge_out}" | grep -qi "already up to date"; then
            echo "git pull did not move off legacy-runtime" >&2
            exit 1
          fi
          got="$(git rev-parse HEAD)"
          if [ "${got}" != "${TARGET_SHA}" ]; then
            echo "HEAD ${got} is not ${TARGET_SHA}" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 7.5.0

      # Runner nevola pnpm install. Cache pnpm store po jobu spadne,
      # protoze ta slozka neexistuje.
      - uses: actions/setup-node@v4
        with:
          node-version: 18.12.1

      - name: pnpm run build
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          node_version="$(node -v)"
          pnpm_version="$(pnpm -v)"
          if [ "${node_version}" != "v18.12.1" ]; then
            echo "node is ${node_version}, want v18.12.1" >&2
            exit 1
          fi
          if [ "${pnpm_version}" != "7.5.0" ]; then
            echo "pnpm is ${pnpm_version}, want 7.5.0" >&2
            exit 1
          fi
          stderr_file="${RUNNER_TEMP}/pnpm-build.stderr"
          set +e
          pnpm run build 2>"${stderr_file}"
          build_status=$?
          set -e
          if [ "${build_status}" -ne 0 ]; then
            echo "pnpm run build exited ${build_status}" >&2
            cat "${stderr_file}" >&2
            exit "${build_status}"
          fi
          if [ -s "${stderr_file}" ]; then
            echo "pnpm run build wrote stderr" >&2
            cat "${stderr_file}" >&2
            exit 1
          fi

      - name: Working tree is clean
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [ -n "${dirty}" ]; then
            echo "working tree is dirty after pnpm run build" >&2
            printf '%s\n' "${dirty}" >&2
            exit 1
          fi

      - name: Release path and failed steps
        shell: bash
        working-directory: source
        run: bash apps/startup/tests/legacy-image-release.sh

  # Prvni boot na stare krabici. Bezi stary startup z tagu legacy-runtime,
  # stare pm2 a PATH bez ~/.bun/bin. Stary startup po chybe startu dist2
  # neobnovi, takze chybny start je krabice, ktera nenabehne.
  legacy-boot1:
    name: legacy-boot1 (${{ matrix.os }}, pm2 ${{ matrix.pm2 }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pm2: ["5.2.0", "6.0.14"]
    steps:
      - name: Checkout legacy-runtime
        uses: actions/checkout@v4
        with:
          ref: legacy-runtime
          fetch-depth: 0

      # Skripty testu jsou jen v hlave PR, tag je nema.
      - name: Fetch the pull request head
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_NUMBER}" ]; then
            git fetch origin "pull/${PR_NUMBER}/head"
          else
            git fetch origin main
          fi
          got="$(git rev-parse FETCH_HEAD)"
          if [ "${got}" != "${TARGET_SHA}" ]; then
            echo "FETCH_HEAD ${got} is not ${TARGET_SHA}" >&2
            exit 1
          fi
          git show "${TARGET_SHA}:source/apps/startup/tests/legacy-boot1.sh" >"${RUNNER_TEMP}/legacy-boot1.sh"
          git show "${TARGET_SHA}:source/apps/startup/tests/assert-runtime.js" >"${RUNNER_TEMP}/assert-runtime.js"

      - uses: pnpm/action-setup@v4
        with:
          version: 7.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 18.12.1

      - name: Old pm2
        shell: bash
        env:
          PM2_VERSION: ${{ matrix.pm2 }}
        run: |
          set -euo pipefail
          npm install -g "pm2@${PM2_VERSION}"
          got="$(pm2 --version | tail -n 1 | tr -d '\r')"
          if [ "${got}" != "${PM2_VERSION}" ]; then
            echo "pm2 is ${got}, want ${PM2_VERSION}" >&2
            exit 1
          fi

      - name: Boot 1 with the old startup app
        shell: bash
        working-directory: source
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash "${RUNNER_TEMP}/legacy-boot1.sh"

  # Bun 1.4.2 je jedina brana pro install, build a testy.
  # Node 18 zustava jen v jobu legacy-image.
  bun:
    name: bun 1.4.2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v4

      - name: Ubuntu startup shell
        run: bash apps/startup/tests/startup.test.sh

      - name: Windows startup.bat shape
        run: bash apps/startup/tests/startup.windows.static.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Stejna verze, jakou drzi apps/startup/versions.env
      - name: Bun version
        run: |
          bun_version="$(bun -v)"
          if [ "${bun_version}" != "1.4.2" ]; then
            echo "bun is ${bun_version}, want 1.4.2" >&2
            exit 1
          fi

      # A registry specifier is one exact version. A range fails this job.
      - name: Exact dependency versions
        run: bun scripts/check-exact-versions.js

      - name: Install
        run: bun install --frozen-lockfile

      # Skripty "lint" maji --fix, coz by tady prepisovalo soubory
      - name: Lint
        run: |
          (cd apps/backend && bun ./node_modules/.bin/eslint --ext .js,.ts .)
          (cd apps/panel && bun ./node_modules/.bin/eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --ignore-path .gitignore)
          (cd apps/startup && bun ./node_modules/.bin/eslint src/ bootstrap.js bootstrap.test.js last-record.js last-record.test.js run-update.js run-update.test.js start-app.js start-app.test.js tests/assert-runtime.js)

      - name: Build config schema
        run: bun --filter @babybox/config-schema build

      - name: Build
        run: bun --filter babybox-panel build && bun --filter babybox-panel-backend build && bun --filter babybox-panel-configer build

      # Build kontroluje jen src panelu. Testy a vite.config.ts kontroluje tenhle krok.
      - name: Panel typecheck
        run: bun --filter babybox-panel typecheck

      - name: Backend dist has no schema import
        run: |
          test -d apps/backend/dist
          ! grep -rl "config-schema" apps/backend/dist

      - name: Config schema tests
        run: bun --filter @babybox/config-schema test

      - name: Backend tests
        run: bun --filter babybox-panel-backend test

      - name: Panel tests
        run: bun --filter babybox-panel test:unit -- --run

      - name: Configer tests
        run: bun --filter babybox-panel-configer test

      - name: Startup tests
        run: (cd apps/startup && ./node_modules/.bin/jest --ci)

  # Kazdy soubor startupu musi projit Node 12. Sken textu na Node 18 tu chybu
  # nechyti. Jmeno jobu zustava, muze to byt povinny check.
  bootstrap-syntax:
    name: bootstrap.js Node 12 parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 12.22.12

      - name: Parse every startup file with Node 12
        run: |
          set -euo pipefail
          node_version="$(node -v)"
          if [ "${node_version}" != "v12.22.12" ]; then
            echo "node is ${node_version}, want v12.22.12" >&2
            exit 1
          fi
          files="$(git ls-files 'source/apps/startup/*.js' | grep -v '\.test\.js$')"
          if ! grep -qx 'source/apps/startup/start-app.js' <<<"${files}"; then
            echo "the file list has no start-app.js" >&2
            exit 1
          fi
          for file in ${files}; do
            echo "${file}"
            node --check "${file}"
          done
          node -e "require('./source/apps/startup/start-app.js')"

  windows-startup:
    name: Windows startup.bat
    runs-on: windows-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4

      - name: Windows startup.bat
        shell: pwsh
        run: ./apps/startup/tests/startup.windows.test.ps1

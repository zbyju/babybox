# Overuje to, co panelove pocitace delaji pri startu. Nejdulezitejsi je frozen
# install: startup.sh po nem konci chybou, takze rozjety lockfile na main by
# znamenal, ze panel nenabehne.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 7.5.0

      # Stejna verze, jakou drzi apps/startup/versions.env
      - uses: actions/setup-node@v4
        with:
          node-version: 18.12.1
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      # A registry specifier is one exact version. A range fails this job.
      - name: Exact dependency versions
        run: node scripts/check-exact-versions.js

      - name: Install
        run: pnpm install --frozen-lockfile

      # Skripty "lint" maji --fix, coz by tady prepisovalo soubory
      - name: Lint
        run: |
          pnpm -F babybox-panel-backend exec eslint --ext .js,.ts .
          pnpm -F babybox-panel exec eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --ignore-path .gitignore
          pnpm -F startup exec eslint src/ bootstrap.js bootstrap.test.js

      # Vsechny aplikace ctou tvar konfigurace odsud, musi se sestavit jako prvni
      - name: Build config schema
        run: pnpm -F @babybox/config-schema build

      - name: Build
        run: pnpm -F babybox-panel build && pnpm -F babybox-panel-backend build && pnpm -F babybox-panel-configer build

      # Backend dist se na boxu instaluje mimo workspace, schema tam smi byt jen typ
      - name: Backend dist has no schema import
        run: |
          test -d apps/backend/dist
          ! grep -rl "config-schema" apps/backend/dist

      - name: Config schema tests
        run: pnpm -F @babybox/config-schema exec vitest run

      - name: Backend tests
        run: pnpm -F babybox-panel-backend exec jest

      - name: Panel tests
        run: pnpm -F babybox-panel exec vitest run --environment jsdom

      - name: Configer tests
        run: pnpm -F babybox-panel-configer exec vitest run

      - name: Startup tests
        run: pnpm -F startup exec jest --ci

  # Prvni boot po pullu. Checkout je tag legacy-runtime, pak git pull na hlavu
  # PR a pnpm run build. Exit 0, prazdny stderr, cisty strom. bun -v, OS_HOLD
  # a build po uz hotovem checkoutu patri do P1.
  legacy-image:
    name: legacy-image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout legacy-runtime
        uses: actions/checkout@v4
        with:
          ref: legacy-runtime
          fetch-depth: 0

      - name: Pull the pull request head
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git checkout -B legacy-image
          if [ -n "${PR_NUMBER}" ]; then
            git fetch origin "pull/${PR_NUMBER}/head"
          else
            git fetch origin main
          fi
          merge_out="$(git merge --ff-only FETCH_HEAD)"
          printf '%s\n' "${merge_out}"
          if [ -z "${merge_out}" ]; then
            echo "git pull produced empty stdout" >&2
            exit 1
          fi
          if printf '%s' "${merge_out}" | grep -qi "already up to date"; then
            echo "git pull did not move off legacy-runtime" >&2
            exit 1
          fi
          got="$(git rev-parse HEAD)"
          if [ "${got}" != "${TARGET_SHA}" ]; then
            echo "HEAD ${got} is not ${TARGET_SHA}" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 7.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 18.12.1
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: pnpm run build
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          node_version="$(node -v)"
          pnpm_version="$(pnpm -v)"
          if [ "${node_version}" != "v18.12.1" ]; then
            echo "node is ${node_version}, want v18.12.1" >&2
            exit 1
          fi
          if [ "${pnpm_version}" != "7.5.0" ]; then
            echo "pnpm is ${pnpm_version}, want 7.5.0" >&2
            exit 1
          fi
          stderr_file="${RUNNER_TEMP}/pnpm-build.stderr"
          set +e
          pnpm run build 2>"${stderr_file}"
          build_status=$?
          set -e
          if [ "${build_status}" -ne 0 ]; then
            echo "pnpm run build exited ${build_status}" >&2
            cat "${stderr_file}" >&2
            exit "${build_status}"
          fi
          if [ -s "${stderr_file}" ]; then
            echo "pnpm run build wrote stderr" >&2
            cat "${stderr_file}" >&2
            exit 1
          fi

      - name: Working tree is clean
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain)"
          if [ -n "${dirty}" ]; then
            echo "working tree is dirty after pnpm run build" >&2
            printf '%s\n' "${dirty}" >&2
            exit 1
          fi

  # Bun 1.4.2. Instalace, build a testy. Job smi selhat.
  # Ukazuje, co se rozbije, nez se z nej v P2 stane brana.
  # Job verify na Node 18 zustava branou.
  bun:
    name: bun 1.4.2 (allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Stejna verze, jakou drzi apps/startup/versions.env
      - name: Bun version
        run: |
          bun_version="$(bun -v)"
          if [ "${bun_version}" != "1.4.2" ]; then
            echo "bun is ${bun_version}, want 1.4.2" >&2
            exit 1
          fi

      - name: Install
        run: bun install

      - name: Build config schema
        run: bun --filter @babybox/config-schema build

      - name: Build
        run: bun --filter babybox-panel build && bun --filter babybox-panel-backend build && bun --filter babybox-panel-configer build

      - name: Backend dist has no schema import
        run: |
          test -d apps/backend/dist
          ! grep -rl "config-schema" apps/backend/dist

      - name: Config schema tests
        run: bun --filter @babybox/config-schema test

      - name: Backend tests
        run: bun --filter babybox-panel-backend test

      - name: Panel tests
        run: bun --filter babybox-panel test:unit -- --run

      - name: Configer tests
        run: bun --filter babybox-panel-configer test

  # bootstrap.js musi projit Node 12. Sken textu na Node 18 tu chybu nechyti.
  bootstrap-syntax:
    name: bootstrap.js Node 12 parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 12.22.12

      - name: Parse bootstrap.js with Node 12
        run: |
          node_version="$(node -v)"
          if [ "${node_version}" != "v12.22.12" ]; then
            echo "node is ${node_version}, want v12.22.12" >&2
            exit 1
          fi
          node --check source/apps/startup/bootstrap.js
